options {
    directory "/var/cache/bind";

    listen-on { 172.30.0.101; };
    listen-on-v6 { none; };

    recursion yes;

    allow-recursion {
        172.30.0.0/24;
    };

    allow-query {
        172.30.0.0/24;
    };

    dnssec-validation yes;
};

trust-anchors {
    . initial-ds 55647 13 2 "BEE04D2E3F7DDEB569F01A95A802F73A0C3CE27D39E8C8D038BD13BC8CB62521";
};

zone "." {
    type hint;
    file "/var/lib/bind/db.root.hints";
};
